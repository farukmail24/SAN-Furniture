services:
  redis:
    image: redis:7-alpine
    container_name: san_furniture_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_local_secure}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_secure}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - san_network

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: san_furniture_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-san_meili_master_key_super_secret_2026}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - san_network

volumes:
  redis_data:
    driver: local
  meili_data:
    driver: local

networks:
  san_network:
    driver: bridge
